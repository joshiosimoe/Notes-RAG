[project]
name = "notes-rag"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "sqlite-vec>=0.1.6",
    "boto3>=1.35",
    "PyYAML>=6.0",
    # The Lambda python3.12 runtime's stdlib sqlite3 is built without
    # loadable-extension support, so sqlite-vec cannot load there. This bundles
    # its own SQLite with extensions enabled. Linux-only: it publishes manylinux
    # wheels but none for macOS/Windows, and the marker keeps installs on those
    # platforms from falling back to a source build (wheels-only constraint).
    # Off Linux, store/sqlite_vec.py falls back to the stdlib sqlite3.
    "pysqlite3-binary>=0.5; sys_platform == 'linux'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
notes-rag-index = "notes_rag.indexer.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: touches AWS; deselected by default"]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 100
