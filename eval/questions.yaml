# Golden questions, anchored on SOURCE SPAN rather than chunk ID.
#
# Chunk IDs are a function of chunking config, so anchoring on them would
# invalidate this file every time chunking changes - which is the main thing
# it exists to measure. A retrieved chunk counts as a hit when its
# start_seconds falls inside the expected range, or its source_path matches.
#
# Spans below are exact section starts read off the two real Video Vault
# artifacts, so a hit requires retrieving that section itself, not a neighbour.
#
# Known limitation: 15 questions over 2 videos moves recall@k in ~6.7%
# increments. Treat this as a regression tripwire, not a measurement. The
# questions are also derived from section titles, and each chunk's context
# prefix contains its section title - so this is closer to a lookup task than
# a hard retrieval test, and scores here read high. Add questions phrased the
# way a user would actually ask before drawing conclusions from the number.
#
# Baseline 2026-08-04 (Titan v2 @ 1024 dims, k=6): recall@6 1.000, MRR 0.967.

